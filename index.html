<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mô phỏng chạy tàu Đường sắt đô thị</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; }
    .box h2 { color: #1f4e79; margin-top: 0; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; }
    button { width: 100%; padding: 10px; background: #1f4e79; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button:hover { background: #12365c; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
    .link-btn { background: none; border: none; color: #1f4e79; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 5px; margin-top: 10px; width: 100%; text-align: center; }
    .hidden { display: none; }
    .success { color: #16a34a !important; }
  </style>
</head>
<body>

  <!-- KHUNG ĐĂNG NHẬP -->
  <div id="loginSection" class="box">
    <h2>ĐĂNG NHẬP</h2>
    <form id="frmLogin">
      <input type="text" id="user" placeholder="Tên đăng nhập" required>
      <input type="password" id="pass" placeholder="Mật khẩu" required>
      <button type="submit" id="btnLogin">Đăng nhập</button>
    </form>
    <div id="msgLogin" class="msg"></div>
    <button type="button" class="link-btn" onclick="toggleView('changePassSection')">Đổi mật khẩu?</button>
  </div>

  <!-- KHUNG ĐỔI MẬT KHẨU -->
  <div id="changePassSection" class="box hidden">
    <h2>ĐỔI MẬT KHẨU</h2>
    <form id="frmChange">
      <input type="text" id="userChange" placeholder="Tên đăng nhập" required>
      <input type="password" id="oldPass" placeholder="Mật khẩu cũ" required>
      <input type="password" id="newPass" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" minlength="6" required>
      <button type="submit" id="btnChange">Cập nhật mật khẩu</button>
    </form>
    <div id="msgChange" class="msg"></div>
    <button type="button" class="link-btn" onclick="toggleView('loginSection')">Quay lại đăng nhập</button>
  </div>

  <script>
    // =========================================================================
    // DÁN WEB APP URL CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw95Gk_Vp9J5a42uoCOrvmxcKiN80D5A73O2v_NzVWbEFkcwO9zSBoaeXvPBKHCzr6U/exec';
    // =========================================================================

    function toggleView(targetId) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('changePassSection').classList.add('hidden');
      document.getElementById(targetId).classList.remove('hidden');
      document.getElementById('msgLogin').textContent = '';
      document.getElementById('msgChange').textContent = '';
    }

    // XỬ LÝ ĐĂNG NHẬP
    document.getElementById('frmLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('user').value;
      const pass = document.getElementById('pass').value;
      const btn = document.getElementById('btnLogin');
      const msg = document.getElementById('msgLogin');

      btn.textContent = 'Đang tải dữ liệu...'; btn.disabled = true; msg.textContent = ''; msg.classList.remove('success');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "login", username: user, password: pass })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          // Ghi đè giao diện bằng mã HTML nhận được từ Server
          const appHTML = data.htmlData;
          document.open(); document.write(appHTML); document.close();
        } else {
          msg.textContent = data.message;
          btn.textContent = 'Đăng nhập'; btn.disabled = false;
        }
      }).catch(err => {
        msg.textContent = 'Lỗi kết nối tới máy chủ xác thực.';
        btn.textContent = 'Đăng nhập'; btn.disabled = false;
      });
    });

    // XỬ LÝ ĐỔI MẬT KHẨU
    document.getElementById('frmChange').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('userChange').value;
      const oldPass = document.getElementById('oldPass').value;
      const newPass = document.getElementById('newPass').value;
      const btn = document.getElementById('btnChange');
      const msg = document.getElementById('msgChange');

      if(oldPass === newPass) {
        msg.textContent = "Mật khẩu mới phải khác mật khẩu hiện tại.";
        return;
      }

      btn.textContent = 'Đang cập nhật...'; btn.disabled = true; msg.textContent = ''; msg.classList.remove('success');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "change_password", username: user, oldPassword: oldPass, newPassword: newPass })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          msg.classList.add('success');
          msg.textContent = data.message;
          document.getElementById('frmChange').reset();
        } else {
          msg.textContent = data.message;
        }
        btn.textContent = 'Cập nhật mật khẩu'; btn.disabled = false;
      }).catch(err => {
        msg.textContent = 'Lỗi kết nối tới máy chủ xác thực.';
        btn.textContent = 'Cập nhật mật khẩu'; btn.disabled = false;
      });
    });
  </script>
</body>
</html>
